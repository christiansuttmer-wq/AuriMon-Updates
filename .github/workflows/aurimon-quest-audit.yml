name: AuriMon Quest- und Texttests

on:
  push:
    branches: [main]
    paths:
      - 'tools/verify-quests.js'
      - 'tools/verify-world50.js'
      - 'tools/audit-content.mjs'
      - 'tools/e2e-browser.py'
      - 'tools/qa-regions-50.py'
      - 'tools/qa-regions-200.py'
      - 'app/src/main/assets/aurimon_final_pass.js'
      - 'app/src/main/assets/arimons_0_4.js'
      - 'app/src/main/assets/arimons_0_4.css'
      - 'app/src/main/assets/v5_5.js'
      - 'app/src/main/assets/aurimon_reset_v158.js'
      - 'app/src/main/assets/auri_1_3_15_auditfix.js'
      - 'app/src/main/assets/auri_1_3_18_startscreen_update.js'
      - '.github/workflows/aurimon-quest-audit.yml'
      - 'app/src/main/assets/aurimon_world50_pilot.js'
      - 'app/src/main/assets/pokemon_gen2_9.js'
      - 'app/src/main/assets/aurimon_2_0.js'
      - 'app/src/main/assets/game.js'
      - 'app/src/main/assets/pokemon_gen9_evolutions.js'
      - 'tools/verify-gen9-evolutions.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-quest-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript, Karten, Spieltexte und Aufgaben testen
        run: |
          set -euo pipefail
          find app/src/main/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node tools/verify-hero-atlas.js
          node tools/verify-world50.js
          node tools/verify-quests.js
          node tools/verify-gen9-evolutions.js

  real-browser-quest-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Python-Skripte pruefen
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build-browser.py tools/e2e-browser.py tools/qa-regions-50.py tools/qa-regions-200.py tools/qa-regions-200.py
      - name: Offline-Browserfassung aus aktuellem App-Code bauen
        run: |
          set -euo pipefail
          AURIMON_BROWSER_VERSION=1.5.8 python3 tools/build-browser.py
          # QA-Werkzeuge auf die aktuelle Offline-Version zeigen lassen.
          sed -i 's/1\.4\.28/1.5.8/g' tools/e2e-browser.py tools/qa-regions-50.py tools/qa-regions-200.py
          node tools/audit-content.mjs
      - name: Echtes Chromium / 200 Karten / 40 Regionen / 40 Questgebiete
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright==1.55.0 pillow==11.1.0
          python3 tools/e2e-browser.py
          python3 tools/qa-regions-200.py
      - name: Pruefberichte und Bilder archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuriMon-v1.5.8-Quest-Browser-QA
          path: |
            browser-dist/PRUEFBERICHT.md
            browser-dist/PRUEFBERICHT.json
            browser-dist/BROWSER_E2E.json
            browser-dist/REGIONEN_200_PRUEFUNG.json
            browser-dist/REGIONEN_200_PRUEFUNG.md
            browser-dist/QA_*.png
